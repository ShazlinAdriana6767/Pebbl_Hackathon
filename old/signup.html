<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png">

  <title>Pebbl - Sign Up</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    :root {
      --vanilla: #FFEBAF;          /* Signature Yellow Background */
      --vanilla-light: #FFF8E3;
      --moonstone: #4C9DB0;        /* Primary Button Color */
      --moonstone-dark: #3B8495;
      --dark-text: #2C3E50;
      --card-bg: #FFFFFF;
      --yellow-accent: #FFD56B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--vanilla);
      color: var(--dark-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .primary-nav-btn {
      background-color: var(--moonstone);
      color: white !important;
    }

    .primary-nav-btn:hover {
      background-color: var(--moonstone-dark);
    }

    /* Centered Sign Up Container */
    .auth-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 3px solid #FFFFFF;
      position: relative;
    }

    .auth-card::before {
      content: '✨';
      position: absolute;
      top: -15px;
      right: 20px;
      font-size: 1.5rem;
    }

    .card-logo {
      height: 65px;
      width: auto;
      margin-bottom: 1rem;
    }

    h2 {
      margin-bottom: 0.5rem;
      color: var(--dark-text);
      font-weight: 800;
      font-size: 1.6rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.85rem;
      margin-bottom: 1rem;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      box-sizing: border-box;
      outline: none;
      font-family: inherit;
      font-size: 0.95rem;
      background-color: #FAFAFA;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--moonstone);
      background-color: #FFFFFF;
    }

    .submit-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 12px;
      background-color: var(--moonstone);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0.8rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(76, 157, 176, 0.3);
    }

    .submit-btn:hover {
      background-color: var(--moonstone-dark);
      transform: translateY(-1px);
    }

    .google-btn {
      width: 100%;
      height: 44px;
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      background-color: #FFFFFF;
      color: var(--dark-text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      transition: background-color 0.2s;
    }

    .google-btn:hover {
      background-color: #F8FAFC;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #A0AEC0;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 1rem 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #E2E8F0;
    }

    .divider span {
      padding: 0 0.5rem;
    }

    .switch-text {
      font-size: 0.9rem;
      color: #718096;
      margin-top: 0.5rem;
    }

    .switch-link {
      color: var(--moonstone-dark);
      text-decoration: none;
      font-weight: 700;
    }

    .switch-link:hover {
      text-decoration: underline;
    }

    #message {
      margin-top: 1rem;
      color: #E53E3E;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="landing.html" class="logo-container">
      <img src="we-are-volunteer-logo.png" alt="We Are Volunteer Logo" class="logo-img" />
      <span class="logo-text">Pebbl</span>
    </a>
    <nav class="nav-links">
      <a href="landing.html#about" class="nav-btn">About Us</a>
      <a href="login.html" class="nav-btn">Log In</a>
      <a href="signup.html" class="nav-btn primary-nav-btn">Sign Up</a>
    </nav>
  </header>

  <!-- Sign Up Form Card -->
  <div class="auth-container">
    <div class="auth-card">
      <img src="we-are-volunteer-logo.png" alt="We Are Volunteer Logo" class="card-logo" />
      <h2>Join Pebbl</h2>
      <p class="subtitle">Create an account to start volunteering</p>

      <form id="signup-form">
        <input type="email" id="email" placeholder="Email Address" required />
        <input type="password" id="password" placeholder="Create Password" minlength="6" required />
        <button type="submit" id="submit-btn" class="submit-btn">Create Account</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button id="google-btn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign up with Google
      </button>

      <p class="switch-text">
        Already have an account? <a href="login.html" class="switch-link">Log In</a>
      </p>

      <div id="message"></div>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
