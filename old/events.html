<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">

  <title>Pebbl - Volunteer Events Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --vanilla: #FFEBAF;
      --vanilla-light: #FFF8E3;
      --moonstone: #4C9DB0;
      --moonstone-dark: #3B8495;
      --dark-text: #000000;
      --card-bg: #FFFFFF;
      --yellow-accent: #FFD56B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--vanilla); color: var(--dark-text); min-height: 100vh; overflow: hidden; }

    /* UNIFIED HEADER STYLES */
    header {
      background-color: var(--card-bg);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      height: 60px;
      position: relative; z-index: 1000;
      border-bottom: 3px solid var(--yellow-accent);
    }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .logo-img { height: 38px; width: auto; object-fit: contain; }
    .logo-text { font-size: 1.5rem; font-weight: 800; color: var(--moonstone); }
    .nav-links { display: flex; gap: 0.75rem; align-items: center; }
    .nav-btn, .logout-btn {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; font-weight: 700; font-size: 0.88rem;
      height: 38px; padding: 0 1.1rem; border-radius: 12px; cursor: pointer; border: none;
    }
    .nav-btn { background-color: transparent; color: #2C3E50; }
    .nav-btn:hover { background-color: var(--vanilla-light); color: var(--moonstone-dark); }
    .nav-btn.active { background-color: var(--moonstone) !important; color: #FFFFFF !important; }
    .logout-btn { background-color: transparent; color: #E53E3E; border: 1.5px solid #E53E3E; }

    /* TWO-COLUMN INTERFACE LAYOUT */
    .map-container {
      display: flex;
      height: calc(100vh - 60px);
      width: 100%;
    }

    /* Left Sidebar List View */
    #sidebar {
      width: 38%;
      max-width: 420px;
      min-width: 300px;
      background: white;
      padding: 1.25rem;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
      z-index: 10;
    }

    #sidebar h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--dark-text);
      margin-bottom: 0.8rem;
    }

    .event-card {
      background: var(--vanilla-light);
      border-left: 5px solid var(--moonstone);
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .event-card h4 {
      margin: 0 0 0.3rem 0;
      color: var(--moonstone-dark);
      font-size: 1rem;
      font-weight: 800;
    }

    .event-card p {
      margin: 0 0 0.5rem 0;
      font-size: 0.88rem;
      color: #000000;
    }

    .event-card .tag {
      display: inline-block;
      background: var(--vanilla);
      color: var(--dark-text);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    /* Right Interactive Map Canvas */
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="app-home.html" class="logo-container">
      <img src="we-are-volunteer-logo.png" alt="Logo" class="logo-img" />
      <span class="logo-text">Pebbl</span>
    </a>
    <nav class="nav-links">
      <a href="app-home.html" class="nav-btn">Home</a>
      <a href="events.html" class="nav-btn active">📍 Events Map</a>
      <a href="communities.html" class="nav-btn">Clubs</a>
      <a href="profile.html" class="nav-btn">My Profile</a>
      <button id="logout-btn" class="logout-btn">Log Out</button>
    </nav>
  </header>

  <!-- Split Screen -->
  <div class="map-container">
    <!-- Sidebar -->
    <div id="sidebar">
      <h3>📍 Nearby Volunteer Events</h3>
      <div id="events-container">
        <p style="color: #718096; font-size: 0.9rem;">Loading nearby events on map...</p>
      </div>
    </div>

    <!-- Map Area -->
    <div id="map"></div>
  </div>

  <!-- Leaflet Engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="events.js"></script>
</body>
</html>
